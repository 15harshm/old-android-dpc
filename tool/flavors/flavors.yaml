# =============================================================================
# SINGLE SOURCE OF TRUTH for every white-label flavor of this DPC.
#
# Adding / changing a client = edit ONE entry here, then run:
#     dart run tool/flavors/gen_flavors.dart
# (or the guided CLI:  dart run tool/flavors/add_flavor.dart --name ... --id ...)
#
# The generator emits two CHECKED-IN artifacts — do NOT hand-edit them:
#     android/flavors.gen.json          (consumed by android/app/build.gradle.kts)
#     lib/config/flavor_registry.g.dart (consumed by lib/config/app_config.dart)
#
# Each flavor lists ONLY what deviates from `defaults`. applicationId is shared
# by every flavor (single-install enrollment DPC).
# =============================================================================

defaults:
  applicationId: "com.renew.jss"          # single-install DPC; never changes
  apiBase: "https://{domain}/api2"        # default REST/data API pattern
  socketBase: "https://socket.{domain}"   # default push / socket server pattern
  currency: "₹"
  term: "EMI"
  usesFastEmiUi: false
  paymentEnable: false
  notifyEnrollUpdate: false

flavors:
  - id: ailocker
    appName: "AI LOCKER"
    domain: "ailocker.org"
    appDescription: "EMI Locker DPC - Required for monitoring app usage and device control"
    accessibilityDescription: "EMI Locker DPC - Required for monitoring app usage and device control"

